[package]
name = "linux_monitor"
version = "0.1.0"
edition = "2021"
description = "Real-time file system monitor for FileGPT (Linux)"

[dependencies]
notify = "6.1"
notify-debouncer-mini = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
